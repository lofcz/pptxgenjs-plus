name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - existing

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Test JSX package
        run: bun run test:jsx

      - name: Test std package
        run: bun run test:std

      - name: Build
        run: bun run dist

      - name: Build JSX package
        run: bun run build:jsx

      - name: Build std package
        run: bun run build:std

      - name: Bump package version
        id: version
        run: |
          if [ "${{ github.event.inputs.release_type }}" != "existing" ]; then
            bun pm version "${{ github.event.inputs.release_type }}" --no-git-tag-version
          fi
          bun scripts/sync-jsx-version.mjs
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.release_type }}" != "existing" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release version and create tag
        if: steps.version.outputs.bumped == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json bun.lock packages/pptxgenjs-jsx/package.json packages/pptxgenjs-std/package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Prepare workspace packages for publish
        run: bun scripts/sync-jsx-version.mjs --publish

      - name: Publish pptxgenjs-plus-jsx to npm
        working-directory: packages/pptxgenjs-jsx
        run: npm publish --provenance --access public

      - name: Publish pptxgenjs-plus-std to npm
        working-directory: packages/pptxgenjs-std
        run: npm publish --provenance --access public

      - name: Restore workspace file dependencies
        if: always() && !cancelled()
        run: bun scripts/sync-jsx-version.mjs

      - name: Push release commit and tag
        if: steps.version.outputs.bumped == 'true'
        run: git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/pptxgen.bundle.js
            dist/pptxgen.min.js
            dist/pptxgen.cjs.js
            dist/pptxgen.es.js
